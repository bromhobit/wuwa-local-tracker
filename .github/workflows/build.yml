name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x86_64
            binary: target/release/wuwa-local-tracker
          - os: windows-latest
            artifact: windows-x86_64
            binary: target/release/wuwa-local-tracker.exe
          - os: macos-14
            artifact: macos-arm64
            binary: target/release/wuwa-local-tracker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build
        run: cargo build --release --locked
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-local-tracker-${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
