name: Linux release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tauri.conf.json'
      - 'build.rs'
      - 'src/**'
      - 'frontend/**'
      - 'capabilities/**'
      - 'icons/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf fuse libfuse2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo tauri build --bundles deb,appimage
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -gt 0 && test "${#images[@]}" -gt 0
          version=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; increase the version for a new release." >&2
            exit 1
          fi
          sha256sum "${debs[@]}" "${images[@]}" | sed 's|target/release/bundle/[^/]*/||' > SHA256SUMS
          gh release create "$tag" "${debs[@]}" "${images[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WuWa Local Tracker $version" --notes "Linux x86-64: AppImage for compatible distributions and DEB for Debian/Ubuntu. History is stored locally."
