name: Linux release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tauri.conf.json'
      - 'build.rs'
      - 'src/**'
      - 'frontend/**'
      - 'capabilities/**'
      - 'icons/**'
      - 'decky-wuwa/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish Decky plugin archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')
          tag="v$version"
          mkdir -p dist
          archive="dist/WuWa-Tracker-Decky-$version.zip"
          zip -r "$archive" decky-wuwa/plugin.json decky-wuwa/package.json decky-wuwa/main.py decky-wuwa/dist/index.js
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WuWa Local Tracker $version" --notes "Decky Loader: архив плагина. Linux x86-64: AppImage, DEB и пакет pacman добавляются после сборки."
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo tauri build --bundles deb,appimage
      - name: Publish Linux packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -gt 0 && test "${#images[@]}" -gt 0
          version=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')
          gh release upload "v$version" "${debs[@]}" "${images[@]}" --clobber --repo "$GITHUB_REPOSITORY"
